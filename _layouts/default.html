<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ site.description }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=5' | relative_url }}">
    <link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" type="image/png" href="{{ '/assets/images/lis.png' | relative_url }}">
  </head>
  <body>
    <div class="site">
      <aside class="sidebar">
        <img class="avatar" src="{{ site.profile.image | relative_url }}" alt="{{ site.profile.name }}">
        <h1>{{ site.profile.name }}</h1>
        <p class="role">{{ site.profile.role }}</p>
        <p class="meta">{{ site.profile.affiliation }}</p>
        <p class="meta">{{ site.profile.location }}</p>

        <p class="bio">{{ site.profile.bio }}</p>

        <ul class="contact">
          <li id="email"></li>
        
          <li>
            <a href="{{ site.profile.orcid }}" target="_blank">
              <i class="fa-brands fa-orcid"></i> ORCID
            </a>
          </li>
        
          <li>
            <a href="https://github.com/{{ site.profile.github }}" target="_blank">
              <i class="fa-brands fa-github"></i> GitHub
            </a>
          </li>
        
          <li>
            <a href="https://linkedin.com/in/{{ site.profile.linkedin }}" target="_blank">
              <i class="fa-brands fa-linkedin"></i> LinkedIn
            </a>
          </li>
        </ul>
      </aside>

      <main class="content">
        <nav class="nav">
          <a href="{{ '/' | relative_url }}">About</a>
          <a href="{{ '/publications/' | relative_url }}">Publications</a>
          <a href="{{ '/talks/' | relative_url }}">Talks</a>
          <a href="{{ '/teaching/' | relative_url }}">Teaching</a>
          <a href="{{ '/cv/' | relative_url }}">CV</a>
        </nav>

        <article class="page">
          {% if page.title and page.title != "Home" %}
            <h1>{{ page.title }}</h1>
          {% endif %}
          {{ content }}
        </article>
      </main>
    </div>

    <script>
    const user = "schaub";
    const domain = "uni-wuppertal.de";
  
    document.getElementById("email").innerHTML =
      `<a href="mailto:${user}@${domain}">
        <i class="fa-solid fa-envelope"></i> Email
      </a>`;
    </script>
  </body>
</html>
