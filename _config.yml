# ---------------------------
# Basic Site Settings
# ---------------------------
locale                   : "en-US"
site_theme               : "default"
title                    : "Welcome!"
title_separator          : "-"
name                     : "Louise Schaub"
description              : "Academic website of Louise Schaub, PhD Candidate in Mathematics at the University of Wuppertal."
url                      : "https://louiseschaub.github.io"
baseurl                  : ""
repository               : "louiseschaub/louiseschaub.github.io"

# ---------------------------
# Author / Sidebar Profile
# ---------------------------
author:
  avatar                 : "lis.png"
  name                   : "Louise Schaub"
  pronouns               :
  bio                    : "PhD Candidate working on scalable kernel-based methods and Gaussian processes, with an emphasis on randomized low-rank approximations and objective-aware approaches."
  location               : "Wuppertal, Germany"
  employer               : "University of Wuppertal"
  uri                    :
  email                  : "schaub@uni-wuppertal.de"

  # Academic profiles
  academia               :
  arxiv                  :
  googlescholar          :
  inspire-hep            :
  impactstory            :
  orcid                  : "https://orcid.org/0009-0001-1992-6474"
  semantic               :
  pubmed                 :
  researchgate           :
  scopus                 :

  # Code / repositories
  bitbucket              :
  codepen                :
  dribbble               :
  github                 : "louiseschaub"
  kaggle                 :
  stackoverflow          :

  # Social media
  artstation             :
  bluesky                :
  facebook               :
  flickr                 :
  foursquare             :
  goodreads              :
  google_plus            :
  keybase                :
  instagram              :
  lastfm                 :
  linkedin               : "louise-schaub/"
  mastodon               :
  medium                 :
  pinterest              :
  soundcloud             :
  steam                  :
  telegram               :
  tumblr                 :
  twitter                :
  vine                   :
  weibo                  :
  wikipedia              :
  xing                   :
  youtube                :
  zhihu                  :

# ---------------------------
# Publication Categories
# ---------------------------
publication_category:
  preprint:
    title: "Preprints"
  manuscript:
    title: "Journal Articles"
  dissertations:
    title: "Dissertations"
  dataset:
    title: "Datasets"

# ---------------------------
# Site Settings
# ---------------------------
teaser                   :
breadcrumbs              : false
words_per_minute         : 160
future                   : false
read_more                : "enabled"
talkmap_link             : false

comments:
  provider               : false

atom_feed:
  hide                   : false
  path                   :

# ---------------------------
# SEO / Social
# ---------------------------
google_site_verification :
bing_site_verification   :
alexa_site_verification  :
yandex_site_verification :

twitter:
  username               :
facebook:
  username               :
  app_id                 :
  publisher              :
og_image                 :
og_description           :

social:
  type                   : "Person"
  name                   : "Louise Schaub"
  links: []

# ---------------------------
# Analytics
# ---------------------------
analytics:
  provider               : false

# ---------------------------
# Reading Files
# ---------------------------
include:
  - .htaccess
  - _pages
  - files

exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor

keep_files:
  - .git
  - .svn

encoding                  : "utf-8"
markdown_ext              : "markdown,mkdown,mkdn,mkd,md"

# ---------------------------
# Conversion
# ---------------------------
markdown                  : kramdown
highlighter               : rouge
lsi                       : false
excerpt_separator         : "\n\n"
incremental               : false

# ---------------------------
# Markdown Processing
# ---------------------------
kramdown:
  input                   : GFM
  hard_wrap               : false
  auto_ids                : true
  footnote_nr             : 1
  entity_output           : as_char
  toc_levels              : 1..6
  smart_quotes            : lsquo,rsquo,ldquo,rdquo
  enable_coderay          : false

# ---------------------------
# Collections
# ---------------------------
collections:
  teaching:
    output                : true
    permalink             : /:collection/:path/
  publications:
    output                : true
    permalink             : /:collection/:path/
  talks:
    output                : true
    permalink             : /:collection/:path/

# ---------------------------
# Defaults
# ---------------------------
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: false
      comments: false

  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: false
      comments: false

  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: false
      comments: false

# ---------------------------
# Sass / SCSS
# ---------------------------
sass:
  sass_dir                : _sass
  style                   : compressed

# ---------------------------
# Output
# ---------------------------
permalink                 : /:categories/:title/
timezone                  : Europe/Berlin

# ---------------------------
# Plugins
# ---------------------------
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# ---------------------------
# Archives
# ---------------------------
category_archive:
  type: liquid
  path: /categories/

tag_archive:
  type: liquid
  path: /tags/

# ---------------------------
# HTML Compression
# ---------------------------
compress_html:
  clippings: all
  ignore:
    envs: development
